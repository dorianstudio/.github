name: Security issue
description: Vulnerability, misconfiguration, or security weakness found in our systems.
title: "fix:"
labels: ["security"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Your best estimate. May be changed in triage.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: What was found
      description: Describe the weakness and how you discovered it.
    validations:
      required: true

  - type: textarea
    id: exposure
    attributes:
      label: Exposure
      description: What data or access is at risk, and who could reach it (public internet, any employee, admins only, etc.).
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Suggested remediation
      description: What you think should change, if you have a view.

  - type: textarea
    id: rd_uncertainty
    attributes:
      label: Research & Development - Technical Uncertainty
      description: What we don't yet know how to do, why existing approaches fall short, and what we plan to try. Add the outcome as a comment when the issue closes.

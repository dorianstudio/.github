name: Bug report
description: Something is broken or behaving incorrectly.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, error output
      description: Paste relevant logs or drag in screenshots. Redact secrets and personal data.

  - type: textarea
    id: rd_uncertainty
    attributes:
      label: Research & Development - Technical Uncertainty
      description: What we don't yet know how to do, why existing approaches fall short, and what we plan to try. Add the outcome as a comment when the issue closes.

name: Task / chore
description: Maintenance, infrastructure, refactoring, or other work with no user-facing change.
title: "chore: "
labels: ["chore"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Dependency update
        - Refactor
        - Infrastructure
        - CI / build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How we will know this is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issues / PRs
      placeholder: "#123, dorianstudio/dorian#456"

  - type: textarea
    id: rd_uncertainty
    attributes:
      label: Research & Development - Technical Uncertainty
      description: What we don't yet know how to do, why existing approaches fall short, and what we plan to try. Add the outcome as a comment when the issue closes.

name: Feature request
description: Propose new functionality or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is hard, slow, or impossible today, and who is affected.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know this is done.
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Blocking a release
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### R&D tax credit tracking
        Optional. Fill this in if the work involves solving a problem we do not yet know how to solve.

  - type: checkboxes
    id: rd_flag
    attributes:
      label: R&D
      options:
        - label: This work involves technical uncertainty and may qualify for the R&D credit.

  - type: textarea
    id: rd_uncertainty
    attributes:
      label: Technical uncertainty and experimentation
      description: What we don't yet know how to do, why existing approaches fall short, and what we plan to try. Add the outcome as a comment when the issue closes.
